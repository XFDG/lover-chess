<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff2e63">
<title>情侣飞行棋 · Love Flight Chess</title>
<link rel="stylesheet" href="src/css/style.css">
</head>
<body>
<h1><span class="heart">💗</span>情侣飞行棋<span class="heart">💗</span></h1>
<div class="sub" id="subTitle">掷骰 · 心动 · 大冒险 🔞 仅供成年人私密娱乐</div>

<div class="layout">
  <div>
    <div class="bar">
      <div class="chip" id="chipPink"><span class="dot pink"></span>你 💗 <b id="scorePink">0/2</b></div>
      <div class="chip" id="chipBlue"><span class="dot blue"></span>TA 💙 <b id="scoreBlue">0/2</b></div>
    </div>
    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board"></div>
      <div class="dock pink" id="dockPink"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
      <div class="dock blue" id="dockBlue"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
      <div class="finish pinkF" id="finPink">💗<br>爱的<br>终点</div>
      <div class="finish blueF" id="finBlue">💙<br>TA 的<br>终点</div>
      <div class="pieces" id="pieces"></div>
    </div>
  </div>

  <div class="controls">
    <div class="msg" id="msg">选择难度，开始游戏吧 💕</div>
    <div class="dice-row">
      <div class="dice" id="dice">
        <div class="pip"></div><div class="pip"></div><div class="pip"></div>
        <div class="pip"></div><div class="pip"></div><div class="pip"></div>
        <div class="pip"></div><div class="pip"></div><div class="pip"></div>
      </div>
    </div>
    <button class="btn" id="rollBtn">🎲 掷骰子</button>
    <button class="btn blue" id="menuBtn" style="padding:8px 18px;font-size:13px;">⚙️ 难度 / 重开</button>
    <div class="legend">
      <span><i class="sw" style="background:var(--gold)"></i>安全格★</span>
      <span><i class="sw" style="background:var(--pink)"></i>跳格+4</span>
      <span><i class="sw" style="background:#e9d7ff"></i>暂停✋</span>
      <span><i class="sw" style="background:#ff2e63"></i>心动💋</span>
    </div>
    <div class="foot">手机 / 电脑 / Mac 浏览器直接玩 · 也可桌面安装</div>
  </div>
</div>

<!-- start / difficulty menu -->
<div class="overlay" id="menu">
  <div class="card">
    <h2>💗 选择难度</h2>
    <p>你执粉 💗，TA 执蓝 💙。谁先把 2 颗棋飞回家谁赢~</p>
    <div class="diff-grid" id="diffGrid"></div>
    <button class="btn" id="startBtn">开始游戏 💕</button>
  </div>
</div>

<!-- result -->
<div class="overlay hidden" id="result">
  <div class="card">
    <h2 id="resultTitle">🎉</h2>
    <p id="resultText"></p>
    <button class="btn" id="againBtn">再玩一次 💗</button>
  </div>
</div>

<!-- 事件卡（惩罚 / 奖励 / 心动 / 姿势） -->
<div class="overlay hidden" id="eventOverlay">
  <div class="card event" id="eventCard">
    <div class="event-emoji" id="eventEmoji">🎴</div>
    <span class="event-tag" id="eventTag">惩罚</span>
    <div class="event-title" id="eventTitle"></div>
    <div class="event-text" id="eventText"></div>
    <div class="btnrow">
      <button class="btn no" id="eventReject">拒绝（倒退1~3格）</button>
      <button class="btn" id="eventOk">接受，继续 💗</button>
    </div>
  </div>
</div>

<!-- 模块加载顺序：config → cards → positions → game -->
<script src="src/js/config.js"></script>
<script src="src/data/cards.js"></script>
<script src="src/data/positions.js"></script>
<script src="src/js/game.js"></script>
</body>
</html>
